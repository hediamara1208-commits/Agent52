[project]
name = "guide"
version = "0.1.0"
description = "Agentic Investment Guide (simulation-only, guidance-only)"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.35",
  "boto3>=1.34",
  "pandas>=2.1",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
include = ["guide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
