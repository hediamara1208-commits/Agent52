# Persona_Templates (Req. 16). Default starting points, not a closed list: edit,
# extend, duplicate, or replace entries. Facts are transcribed from section 3 of
# data/context.md; every `excerpt` is copied verbatim from that file (including its
# Markdown markup) so tests/test_personas.py can check it with a substring match.
# Contract_Value basis: quoted = stated in context.md; assumption = team choice,
# explained in `rationale`. A list-valued fact stores one excerpt per item.
version: 1
source: data/context.md, section 3
personas:
  - id: amira
    display_name: Amira
    risk_level: high
    horizon: {min: 15}
    facts:
      age:
        value: 26
        excerpt: "AMIRA (26 ans, ingénieure logicielle)"
      occupation:
        value: software engineer
        excerpt: "ingénieure logicielle"
      risk_level:
        value: high
        excerpt: "**Risque : élevé**"
      horizon:
        value: {min: 15}
        excerpt: "**Horizon : 15 ans ou +**"
      family_situation:
        value: single, no children
        excerpt: "Célibataire, sans enfant"
      experience:
        value: intermediate
        excerpt: "Expérience : intermédiaire"
      objective:
        value: grow capital over the long term
        excerpt: "faire croître son capital à long terme"
      preferences_constraints:
        value:
          - very interested in AI and emerging technologies
          - open to high-growth companies and high volatility
          - interested in crypto assets
          - wants some diversification and to avoid betting only on tech
        excerpt:
          - "très intéressée par l'IA et technologies émergentes"
          - "ouverte aux entreprises en forte croissance et à une forte volatilité"
          - "intéressée par les cryptoactifs"
          - "veut une certaine **diversification** et éviter de miser exclusivement sur la tech"
      persona_tests:
        value: how far the system accepts risk; high risk does not mean everything is acceptable
        excerpt: "jusqu'où le système accepte le risque"
    contract_values:
      horizon_years:
        value: 15
        basis: quoted
        excerpt: "**Horizon : 15 ans ou +**"
        rationale: Lower bound of the quoted horizon; conservative for drawdown tolerance.
      max_volatility:
        value: 0.35
        basis: assumption
        rationale: Annualized volatility limit scaled to the high risk level.
      max_drawdown:
        value: 0.40
        basis: assumption
        rationale: Tolerates deep drawdowns on a 15-year horizon, but not total loss.
      per_asset_cap:
        value: 0.15
        basis: assumption
        rationale: Context asks for some diversification; applies to single securities and crypto, not to diversified ETFs.
      per_asset_class_caps:
        value: {crypto: 0.15}
        basis: assumption
        rationale: Interested in crypto, but high risk does not mean everything is acceptable.
      sector_caps:
        value: {Information Technology: 0.40}
        basis: assumption
        rationale: Context asks to avoid betting only on tech.
      crypto_cap:
        value: 0.15
        basis: assumption
        rationale: Interested in crypto assets; highest crypto cap of the three Personas, still bounded.
      esg_exclusions:
        value: []
        basis: assumption
        rationale: Context states no ESG preference for Amira.
      speculative_limit:
        value: null
        basis: assumption
        rationale: Open to high growth and high volatility, so no speculative-asset limit is set.
      base_portfolio:
        value: {QQQ: 0.25, SPY: 0.20, XIU.TO: 0.15, NVDA: 0.10, MSFT: 0.10, BTC-USD: 0.10, SHOP.TO: 0.05, XBB.TO: 0.05}
        basis: assumption
        rationale: Fictional portfolio consistent with a high-risk, tech-leaning growth profile; passes the persona's own Hard_Rules (Req. 28).
    soft_preferences:
      - id: diversification
        text: Wants some diversification and to avoid betting only on tech.
        basis: quoted
        excerpt: "veut une certaine **diversification** et éviter de miser exclusivement sur la tech"
      - id: growth_companies
        text: Open to high-growth companies and high volatility.
        basis: quoted
        excerpt: "ouverte aux entreprises en forte croissance et à une forte volatilité"

