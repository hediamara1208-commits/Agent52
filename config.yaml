# No credentials belong in this file. AWS credentials come from the default
# AWS credential chain (role, profile, or environment), never from config.
aws_region: us-east-1
model_id: "us.anthropic.claude-sonnet-5-5"   # US cross-region inference profile, tested with Converse on the event account
# Per-agent model IDs (Req. 36); an empty value falls back to model_id.
model_ids:
  advocate: "us.anthropic.claude-sonnet-5-5"
  investigator: "us.anthropic.claude-sonnet-5-5"   # us.anthropic.claude-haiku-5-5 if latency is too high
  judge: "us.anthropic.claude-sonnet-5-5"
# Agent flow settings (Req. 4.9, 36.3).
advocate_scope: size_only   # size_only | universe
agent_timeout_seconds: 60
guardrail_id: "3981l0ehd4uu"   # verdict-guardrail: output topics RealTransactions, ReturnPredictions; prompt-attack filter on input
guardrail_version: "DRAFT"

# Amazon S3 is the system of record in every environment. The local cache only
# stores downloaded snapshot objects and is never a primary data source.
s3_bucket: alphaforge-guide-data
s3_prefix: dataset
cache_dir: /workshop/Agent52/.cache/dataset
s3_connect_timeout_seconds: 3
s3_read_timeout_seconds: 10
s3_max_attempts: 3

# AWS Glue and Athena data validation settings.
glue_database: alphaforge_guide
athena_workgroup: alphaforge-guide
athena_results_uri: s3://alphaforge-guide-athena-results/results/
athena_bytes_scanned_cutoff: 104857600

# Local inputs are used only by seed import and deterministic file loaders.
seed_dir: /workshop/Agent52/data
persona_file: guide/contract/personas.yaml
instruction_dir: guide/agents

# Sensitivity ranges are [minimum, maximum, step].
sensitivity_ranges:
  position_size: [0.0, 0.5, 0.005]   # same 0.5-point grid as max_weight_within_contract
  horizon_years: [1, 20, 1]
speculative_volatility_threshold: 0.45   # NVDA (51.1 % CAD vol) is speculative; away from any asset's value
trace_summary_max_chars: 400

# Deployment-provided values. Leave blank for a local run until CDK outputs
# are available; they do not contain credentials.
session_table: alphaforge-guide-sessions
agent_runtime_arn: ""
agentcore_memory_id: ""
cors_origin: ""

# Publication lag in days after the reference date, per macro series.
# Monthly series carry the reference month start date; value is available
# only after reference date + lag.
macro_publication_lag_days:
  CPIAUCSL: 45
  UNRATE: 38
  STATIC_TOTALCPICHANGE: 45
  DFF: 1
  DGS10: 1
  DGS2: 1
  BD.CDN.10YR.DQ.YLD: 1
  BD.CDN.2YR.DQ.YLD: 1
  V39079: 1
